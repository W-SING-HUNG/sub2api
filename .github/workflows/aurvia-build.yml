name: Build Aurvia Sub2API

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fixed Sub2API commit
        uses: actions/checkout@v4
        with:
          ref: 4726bdd08b6201d426a80529b79be123a4008d20

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/w-sing-hung/sub2api:aurvia-4726bdd
            ghcr.io/w-sing-hung/sub2api:aurvia-stable
          cache-from: type=gha
          cache-to: type=gha,mode=max
