name: Build Aurvia Sub2API

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Wei-Shaw/sub2api commit SHA, tag, or branch"
        required: true
        default: "bdb42e22f81fcb633ff0a060961211dd2bcb515b"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream Sub2API
        uses: actions/checkout@v4
        with:
          repository: Wei-Shaw/sub2api
          ref: ${{ inputs.upstream_ref }}

      - name: Resolve upstream commit
        id: version
        shell: bash
        run: |
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Building upstream commit: $FULL_SHA"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/w-sing-hung/sub2api:aurvia-${{ steps.version.outputs.short_sha }}
            ghcr.io/w-sing-hung/sub2api:aurvia-candidate
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.full_sha }}
            org.opencontainers.image.source=https://github.com/Wei-Shaw/sub2api
          cache-from: type=gha
          cache-to: type=gha,mode=max
